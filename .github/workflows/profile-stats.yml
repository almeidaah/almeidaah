name: Refresh public profile statistics

on:
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:
  push:
    paths:
      - scripts/update_stats.py
      - .github/workflows/profile-stats.yml

permissions:
  contents: read

concurrency:
  group: profile-stats-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Fetch public statistics
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/update_stats.py
      - name: Commit refreshed card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg assets/github-stats-light.svg
          if git diff --cached --quiet; then
            echo "Statistics card is unchanged."
          else
            git commit -m "docs: refresh public GitHub statistics"
            git push
          fi
